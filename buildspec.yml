version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
      java: corretto21
  build:
    commands:
      - echo "Running frontend automated tests"
      - cd frontend
      - npm ci
      - npm test -- --run
      - echo "Building backend Maven package"
      - cd ../backend
      - chmod +x mvnw
      - ./mvnw -DskipTests package
