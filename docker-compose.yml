services:
  backend:
    build:
      context: ./backend
    container_name: users-posts-browser-backend
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      AWS_PROFILE: ${AWS_PROFILE:-default}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      APP_DYNAMODB_ENABLED: ${APP_DYNAMODB_ENABLED:-true}
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-dce042-users-posts}
      APP_DEV_RESET_ENABLED: ${APP_DEV_RESET_ENABLED:-false}
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - '8080:8080'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ENABLE_DEV_TOOLS: ${VITE_ENABLE_DEV_TOOLS:-false}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-Local Development}
        VITE_DEPLOY_ENV: ${VITE_DEPLOY_ENV:-Local environment}
    container_name: users-posts-browser-frontend
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
    depends_on:
      - backend
    ports:
      - '3000:80'
